# Single source of truth for credentials the prompt-manager plugin needs.
# setup-prompt-manager iterates this list: memory search → local probe → ask → verify.

[[item]]
key = "clickup.token"
kind = "secret"
required = true
description = "ClickUp personal API token (Settings → Apps)"
memory_queries = ["clickup token", "clickup api key", "CLICKUP_TOKEN", "clickup access"]
env = ["CLICKUP_TOKEN", "CLICKUP_API_TOKEN"]
config_key = "clickup.token"
verify = "clickup"

[[item]]
key = "clickup.user_id"
kind = "id"
required = false
description = "ClickUp user id used to filter 'my' sprint tasks. Derived from clickup.token via GET /user when omitted."
memory_queries = ["clickup user id", "my clickup id", "CLICKUP_USER_ID"]
env = ["CLICKUP_USER_ID"]
config_key = "clickup.user_id"
verify = "clickup_user"

[[item]]
key = "clickup.team_id"
kind = "id"
required = false
default = "4540126"
description = "ClickUp workspace/team id (Anima International default)"
memory_queries = ["clickup team id", "clickup workspace id"]
env = ["CLICKUP_TEAM_ID"]
config_key = "clickup.team_id"

[[item]]
key = "clickup.sprint_folder"
kind = "id"
required = false
default = "90127244534"
description = "ClickUp folder that holds Sprint {N} lists"
memory_queries = ["clickup sprint folder", "IT sprint folder"]
env = ["CLICKUP_SPRINT_FOLDER"]
config_key = "clickup.sprint_folder"

[[item]]
key = "slack.token"
kind = "secret"
required = false
description = "Slack user token with search.messages (task-context Slack sweep)"
memory_queries = ["slack token", "SLACK_TOKEN", "slack user token", "slack access"]
env = ["SLACK_TOKEN", "SLACK_USER_TOKEN"]
config_key = "slack.token"
verify = "slack"

[[item]]
key = "github.token"
kind = "secret"
required = false
description = "GitHub token; optional if `gh auth status` already succeeds"
memory_queries = ["github token", "GITHUB_TOKEN", "GH_TOKEN", "gh auth"]
env = ["GITHUB_TOKEN", "GH_TOKEN"]
config_key = "github.token"
verify = "github"

[[item]]
key = "github.org"
kind = "id"
required = false
default = "otwarteklatki"
description = "Default GitHub org for task-context PR/code search"
memory_queries = ["github org", "otwarteklatki"]
env = ["GITHUB_ORG"]
config_key = "github.org"

[[item]]
key = "github.username"
kind = "id"
required = false
description = "GitHub username"
memory_queries = ["github username", "my github login"]
env = ["GITHUB_USERNAME"]
config_key = "github.username"

[[item]]
key = "gcloud"
kind = "cli"
required = false
description = "gcloud user or application-default credentials (live infra checks)"
memory_queries = ["gcloud auth", "GCP credentials", "GOOGLE_APPLICATION_CREDENTIALS", "adc"]
env = ["GOOGLE_APPLICATION_CREDENTIALS", "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE"]
verify = "gcloud"

[[item]]
key = "gcp.project"
kind = "id"
required = false
default = "otwarte-klatki"
description = "Default GCP project for live infra checks"
memory_queries = ["gcp project", "otwarte-klatki"]
env = ["GOOGLE_CLOUD_PROJECT", "GCLOUD_PROJECT"]
config_key = "gcp.project"

[[item]]
key = "railway.token"
kind = "secret"
required = false
description = "Railway account token (task-context Railway-side tasks)"
memory_queries = ["railway token", "RAILWAY_TOKEN", "railway access"]
env = ["RAILWAY_TOKEN"]
config_key = "railway.token"
verify = "railway"

[[item]]
key = "user.name"
kind = "id"
required = false
description = "Display name for 'me' in sprint tables"
memory_queries = ["my name", "user.name"]
env = ["PROMPT_MANAGER_USER_NAME"]
config_key = "user.name"
